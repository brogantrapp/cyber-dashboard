<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Dashboard</title>

<link rel="stylesheet" href="style.css">

<link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
/>

</head>


<body>


<!-- STARTUP -->

<div id="startup">

    <img id="idleGif" src="assets/idle.gif">

    <div id="startOverlay">

        <h2>
            PRESS SPACE TO START
        </h2>

    </div>

</div>





<!-- APPLICATION -->

<div id="app">


    <aside id="sidebar">


        <button id="menu">
            ☰
        </button>


        <nav>

            <button data-tool="dashboard">Dashboard</button>
            <button data-tool="map">Map</button>
            <button data-tool="iplookup">IP Lookup</button>
            <button data-tool="coordinates">Coordinates</button>
            <button data-tool="dns">DNS</button>
            <button data-tool="whois">WHOIS</button>
            <button data-tool="tools">Tools</button>
            <button data-tool="settings">Settings</button>

        </nav>


    </aside>





    <main>


        <header>

            <input
                id="searchInput"
                placeholder="Search..."
            >


            <div id="status">

                ● ONLINE

            </div>

        </header>





        <section id="workspace">


            <!-- MAP PANEL -->

            <div class="panel mapPanel">


                <h3>
                    MAP
                </h3>


                <div id="map"></div>


                <div id="coordinates">

                    LAT: --<br>
                    LON: --

                </div>


            </div>





            <!-- TOOLS PANEL -->

            <div class="panel tools">


                <h3 id="toolTitle">

                    TOOLS

                </h3>


                <div id="toolContent">


                    <div class="placeholder">

                        SELECT A TOOL

                    </div>


                </div>


            </div>


        </section>





        <footer>

            SYSTEM READY

        </footer>


    </main>


</div>





<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script src="script.js"></script>


</body>

</html>
